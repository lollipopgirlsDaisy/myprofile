<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of a deployment runbook checklist with a rollback path and terminal">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7ED"/><stop offset="1" stop-color="#FFEDD5"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#9A3412" flood-opacity=".2"/></filter>
<marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker>
</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<circle cx="680" cy="110" r="150" fill="#FED7AA" opacity=".45"/><circle cx="90" cy="460" r="120" fill="#fff" opacity=".6"/>
<!-- checklist -->
<g filter="url(#sh)">
<rect x="60" y="60" width="330" height="380" rx="22" fill="#fff"/>
<rect x="84" y="84" width="120" height="12" rx="6" fill="#1C1917"/><rect x="84" y="104" width="80" height="8" rx="4" fill="#D6D3D1"/>
<rect x="300" y="82" width="66" height="24" rx="12" fill="#FFEDD5"/><rect x="314" y="90" width="38" height="8" rx="4" fill="#C2410C"/>
<g>
<rect x="84" y="134" width="282" height="48" rx="12" fill="#FAFAF9"/><circle cx="108" cy="158" r="12" fill="#22C55E"/><path d="M102 158l4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="152" width="130" height="10" rx="5" fill="#44403C"/>
<rect x="84" y="192" width="282" height="48" rx="12" fill="#FAFAF9"/><circle cx="108" cy="216" r="12" fill="#22C55E"/><path d="M102 216l4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="210" width="110" height="10" rx="5" fill="#44403C"/>
<rect x="84" y="250" width="282" height="48" rx="12" fill="#FAFAF9"/><circle cx="108" cy="274" r="12" fill="#22C55E"/><path d="M102 274l4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="268" width="150" height="10" rx="5" fill="#44403C"/>
<rect x="84" y="308" width="282" height="48" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/><circle cx="108" cy="332" r="12" fill="none" stroke="#F97316" stroke-width="3"/><circle cx="108" cy="332" r="4" fill="#F97316"/><rect x="130" y="326" width="120" height="10" rx="5" fill="#C2410C"/>
<rect x="84" y="366" width="282" height="48" rx="12" fill="#FAFAF9"/><circle cx="108" cy="390" r="12" fill="none" stroke="#D6D3D1" stroke-width="3"/><rect x="130" y="384" width="96" height="10" rx="5" fill="#D6D3D1"/>
</g>
</g>
<!-- pipeline -->
<g>
<line x1="440" y1="120" x2="720" y2="120" stroke="#1C1917" stroke-width="4" stroke-linecap="round"/>
<circle cx="450" cy="120" r="16" fill="#1C1917"/><circle cx="545" cy="120" r="16" fill="#1C1917"/><circle cx="640" cy="120" r="16" fill="#F97316"/><circle cx="720" cy="120" r="12" fill="#fff" stroke="#1C1917" stroke-width="4"/>
<path d="M640 146 C640 200 545 200 545 152" fill="none" stroke="#C2410C" stroke-width="3.5" stroke-dasharray="7 7" marker-end="url(#ar)"/>
<rect x="556" y="190" width="76" height="26" rx="13" fill="#fff" stroke="#F97316" stroke-width="2"/><rect x="570" y="199" width="48" height="8" rx="4" fill="#C2410C"/>
<g fill="#78716C"><rect x="430" y="150" width="40" height="7" rx="3.5"/><rect x="525" y="84" width="40" height="7" rx="3.5"/><rect x="620" y="84" width="40" height="7" rx="3.5"/></g>
</g>
<!-- terminal -->
<g filter="url(#sh)">
<rect x="430" y="250" width="320" height="190" rx="18" fill="#1C1917"/>
<circle cx="454" cy="272" r="5" fill="#F87171"/><circle cx="470" cy="272" r="5" fill="#FBBF24"/><circle cx="486" cy="272" r="5" fill="#4ADE80"/>
<g font-family="ui-monospace,Menlo,monospace" font-size="15">
<text x="452" y="312" fill="#FB923C">$</text><rect x="470" y="302" width="150" height="10" rx="5" fill="#E7E5E4"/>
<text x="452" y="342" fill="#4ADE80">✓</text><rect x="470" y="332" width="210" height="10" rx="5" fill="#57534E"/>
<text x="452" y="372" fill="#4ADE80">✓</text><rect x="470" y="362" width="180" height="10" rx="5" fill="#57534E"/>
<text x="452" y="402" fill="#FB923C">$</text><rect x="470" y="392" width="12" height="16" fill="#F97316"/>
</g>
</g>
<g fill="#F97316"><path d="M410 40l5 11 11 5-11 5-5 11-5-11-11-5 11-5z"/></g>
</svg>
