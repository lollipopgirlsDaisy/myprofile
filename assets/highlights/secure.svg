<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of a secured website with a shield and a wireframe layout">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C1917"/><stop offset="1" stop-color="#431407"/></linearGradient>
<linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#C2410C"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F97316" stop-opacity=".55"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".4"/></filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect width="800" height="500" fill="url(#grid)"/>
<!-- wireframe browser -->
<g filter="url(#sh)">
<rect x="70" y="70" width="400" height="360" rx="20" fill="#FAFAF9"/>
<rect x="70" y="70" width="400" height="40" rx="20" fill="#E7E5E4"/><rect x="70" y="92" width="400" height="18" fill="#E7E5E4"/>
<circle cx="96" cy="90" r="5" fill="#F87171"/><circle cx="114" cy="90" r="5" fill="#FBBF24"/><circle cx="132" cy="90" r="5" fill="#4ADE80"/>
<rect x="180" y="82" width="200" height="16" rx="8" fill="#fff"/><path d="M192 86v8M188 90h8" stroke="#16A34A" stroke-width="0"/><rect x="190" y="85" width="9" height="10" rx="2" fill="#16A34A"/>
<g fill="none" stroke="#A8A29E" stroke-width="2" stroke-dasharray="6 5">
<rect x="94" y="130" width="352" height="110" rx="10"/><path d="M94 130l352 110M446 130L94 240"/>
<rect x="94" y="256" width="108" height="76" rx="10"/><rect x="216" y="256" width="108" height="76" rx="10"/><rect x="338" y="256" width="108" height="76" rx="10"/>
</g>
<g fill="#D6D3D1"><rect x="94" y="350" width="200" height="10" rx="5"/><rect x="94" y="370" width="300" height="10" rx="5"/><rect x="94" y="390" width="250" height="10" rx="5"/></g>
<rect x="352" y="380" width="94" height="30" rx="15" fill="#F97316"/>
</g>
<!-- glow + rings -->
<circle cx="580" cy="250" r="190" fill="url(#glow)"/>
<g fill="none" stroke="#FB923C" stroke-opacity=".35" stroke-width="2"><circle cx="580" cy="250" r="110"/><circle cx="580" cy="250" r="150" stroke-dasharray="4 10"/><circle cx="580" cy="250" r="190" stroke-opacity=".18"/></g>
<!-- shield -->
<g filter="url(#sh)">
<path d="M580 140l90 36v70c0 58-38 96-90 116-52-20-90-58-90-116v-70z" fill="url(#shield)"/>
<path d="M580 162l70 28v56c0 46-29 76-70 92z" fill="#fff" opacity=".14"/>
<path d="M548 252l22 22 42-46" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- small cards -->
<g filter="url(#sh)">
<rect x="640" y="380" width="130" height="56" rx="14" fill="#fff"/><rect x="654" y="394" width="28" height="28" rx="8" fill="#FFEDD5"/><rect x="661" y="404" width="14" height="12" rx="2" fill="none" stroke="#C2410C" stroke-width="2.5"/><path d="M664 404v-3a4 4 0 0 1 8 0v3" fill="none" stroke="#C2410C" stroke-width="2.5"/><rect x="692" y="398" width="60" height="8" rx="4" fill="#1C1917"/><rect x="692" y="412" width="40" height="7" rx="3.5" fill="#D6D3D1"/>
<rect x="660" y="60" width="110" height="50" rx="14" fill="#fff"/><path d="M676 92l12-14 10 8 14-16 14 10" fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="742" cy="80" r="4" fill="#16A34A"/>
</g>
<g fill="#FB923C"><path d="M490 60l5 11 11 5-11 5-5 11-5-11-11-5 11-5z"/><path d="M40 460l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/></g>
</svg>
